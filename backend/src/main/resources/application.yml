# Configuración de CondoFlow (Capítulo 05).
# Base: condoflow · Usuario: condoflow_admin · Schema: condoflow (Guía DataGrip).
# Las credenciales reales NO se versionan: copiar backend/.env.example como backend/.env y completar DB_PASSWORD.
spring:
  application:
    name: condoflow-backend
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/condoflow}
    username: ${DB_USERNAME:condoflow_admin}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: condoflow
        format_sql: true
    open-in-view: false

  # Migraciones versionadas (Clase 06): db/migration/V1__init_core.sql, V2__seed_core.sql, V3...
  flyway:
    schemas: condoflow
    default-schema: condoflow
    create-schemas: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: debug
