# Configuración de CondoFlow.
# Las credenciales NO se versionan: se leen de variables de entorno o de backend/.env
# (copiar backend/.env.example a backend/.env y completar DB_PASSWORD).
spring:
  application:
    name: condoflow-backend
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/condoflow}
    username: ${DB_USERNAME:condoflow}
    password: ${DB_PASSWORD}

  flyway:
    # Todas las tablas del proyecto viven en el schema "condoflow".
    schemas: condoflow
    default-schema: condoflow
    create-schemas: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      # El esquema lo crean las migraciones de Flyway; Hibernate sólo verifica que el mapeo coincida.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: condoflow
        format_sql: true
    open-in-view: false

condoflow:
  cors:
    # Orígenes del frontend autorizados a llamar a /api/** (separados por coma).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: debug
