# Integración continua: cada push o pull request compila y prueba backend y frontend.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java 21 + Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # "verify" compila y ejecuta todas las pruebas. Las de integración usan Testcontainers:
      # los runners de GitHub tienen Docker, así que aquí sí corren contra PostgreSQL real.
      - name: Compilar y probar
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  web:
    name: Web (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (verifica tipos con tsc)
        run: npm run build
